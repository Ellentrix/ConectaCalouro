<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConectaCalouro — Início</title>
  <link rel="stylesheet" href="../CSS/style.css" />
</head>
<body>
  <nav class="navbar"><div id="navbar"></div></nav>

  <div class="page">
    <div class="page-header">
      <div>
        <h1 id="titulo-boas-vindas">Olá!</h1>
        <p id="subtitulo-boas-vindas"></p>
      </div>
    </div>

    <div class="grid" id="grid-acessos"></div>
  </div>

  <script src="js/dados.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/script.js"></script>
  <script>
    const usuario = ccProtegerPagina();
    if (usuario) {
      ccRenderNavbar("inicio");

      document.getElementById("titulo-boas-vindas").textContent = `Olá, ${usuario.nome.split(" ")[0]}!`;

      const textosPorTipo = {
        novato: "Você está logado como Aluno Novato. Explore os materiais e dicas dos veteranos e participe do mural para conhecer a turma.",
        veterano: "Você está logado como Aluno Veterano. Compartilhe materiais e dicas para ajudar os calouros a se adaptarem.",
        admin: "Você está logado como Administrador. Acompanhe denúncias e gerencie os usuários da plataforma."
      };
      document.getElementById("subtitulo-boas-vindas").textContent = textosPorTipo[usuario.tipo];

      const cartoes = [
        { href: "materiais.html", icone: "📚", titulo: "Materiais de estudo", desc: "Veja resumos e listas de exercícios por disciplina." },
        { href: "dicas.html", icone: "💡", titulo: "Dicas para calouros", desc: "Orientações de quem já passou pela adaptação." },
        { href: "interacao.html", icone: "💬", titulo: "Mural / Interação", desc: "Converse, comente e conheça outros alunos." },
        { href: "perfil.html", icone: "👤", titulo: "Meu perfil", desc: "Veja seus dados e encerre sua sessão." }
      ];
      if (usuario.tipo === "admin") {
        cartoes.push({ href: "admin.html", icone: "🛡️", titulo: "Administração", desc: "Gerencie usuários e avalie denúncias." });
      }

      document.getElementById("grid-acessos").innerHTML = cartoes
        .map(
          (c) => `
        <a class="item-card" href="${c.href}" style="text-decoration:none;">
          <div style="font-size:1.6rem;">${c.icone}</div>
          <h3>${c.titulo}</h3>
          <p class="desc">${c.desc}</p>
        </a>`
        )
        .join("");
    }
  </script>
</body>
</html>
