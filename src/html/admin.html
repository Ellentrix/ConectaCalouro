<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConectaCalouro — Administração</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <nav class="navbar"><div id="navbar"></div></nav>

  <div class="page">
    <div class="page-header">
      <div>
        <h1>Área administrativa</h1>
        <p>Gerencie usuários e avalie conteúdos denunciados pela comunidade.</p>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="tab-usuarios">Usuários</button>
      <button class="tab-btn" data-tab="tab-denuncias">Denúncias</button>
    </div>

    <div id="tab-usuarios" class="tab-panel active">
      <table>
        <thead>
          <tr><th>Nome</th><th>E-mail</th><th>Tipo</th><th>Situação</th><th>Ação</th></tr>
        </thead>
        <tbody id="tabela-usuarios"></tbody>
      </table>
    </div>

    <div id="tab-denuncias" class="tab-panel">
      <div class="grid" id="lista-denuncias"></div>
    </div>
  </div>

  <script src="../js/dados.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/script.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
