<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConectaCalouro — Dicas</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <nav class="navbar"><div id="navbar"></div></nav>

  <div class="page">
    <div class="page-header">
      <div>
        <h1>Dicas para calouros</h1>
        <p>Orientações de alunos veteranos sobre estudos, provas e rotina escolar.</p>
      </div>
    </div>

    <div id="aviso-permissao" class="alert alert-info" style="display:none;">
      Alunos novatos podem visualizar e denunciar dicas. Apenas alunos veteranos e administradores podem publicar novas dicas.
    </div>

    <div id="bloco-form-dica" class="card" style="margin-bottom:24px; display:none;">
      <h3 style="margin-top:0;">Publicar nova dica</h3>
      <form id="form-dica">
        <div class="field">
          <label for="dica-titulo">Título</label>
          <input type="text" id="dica-titulo" required />
        </div>
        <div class="field">
          <label for="dica-categoria">Categoria</label>
          <input type="text" id="dica-categoria" placeholder="Ex: Organização, Adaptação, Rotina..." required />
        </div>
        <div class="field">
          <label for="dica-conteudo">Conteúdo da dica</label>
          <textarea id="dica-conteudo" rows="3" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Publicar dica</button>
      </form>
    </div>

    <div class="toolbar">
      <label for="filtro-categoria" style="font-size:0.88rem; color:var(--muted);">Filtrar por categoria:</label>
      <select id="filtro-categoria">
        <option value="">Todas</option>
        <option>Organização</option>
        <option>Adaptação</option>
        <option>Disciplinas</option>
        <option>Rotina</option>
      </select>
    </div>

    <div class="grid" id="lista-dicas"></div>
  </div>

<script src="../js/dados.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/script.js"></script>
<script src="../js/dicas.js"></script>
</body>
</html>
