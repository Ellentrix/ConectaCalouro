<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConectaCalouro — Mural</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <nav class="navbar"><div id="navbar"></div></nav>

  <div class="page">
    <div class="page-header">
      <div>
        <h1>Mural de interação</h1>
        <p>Um espaço simples para novatos e veteranos se conhecerem e tirarem dúvidas juntos.</p>
      </div>
    </div>

    <div class="card" style="margin-bottom:24px;">
      <form id="form-publicacao">
        <div class="field">
          <label for="novo-texto">O que você quer compartilhar com a turma?</label>
          <textarea id="novo-texto" rows="3" maxlength="300" placeholder="Escreva sua publicação..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Publicar</button>
      </form>
    </div>

    <div id="lista-publicacoes"></div>
  </div>

<script src="../js/dados.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/script.js"></script>
<script src="../js/interacao.js"></script>
</body>
</html>
